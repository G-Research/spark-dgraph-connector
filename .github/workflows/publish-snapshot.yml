name: Publish snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check-version:
    name: Check SNAPSHOT version
    if: (! github.event.repository.fork)
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      is-snapshot: ${{ steps.check.outputs.is-snapshot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if this is a SNAPSHOT version
        id: check
        run: |
          if grep -q "<version>.*-SNAPSHOT</version>" pom.xml
          then
            echo "Version in pom IS a SNAPSHOT version"
            echo "is-snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version in pom is NOT a SNAPSHOT version"
            echo "is-snapshot=false" >> "$GITHUB_OUTPUT"
          fi

  snapshot:
    name: Snapshot Spark ${{ matrix.params.spark-version }} Scala ${{ matrix.params.scala-version }}
    needs: check-version
    if: needs.check-version.outputs.is-snapshot == 'true'
    runs-on: ubuntu-latest
    environment:
      name: snapshot
      url: https://github.com/G-Research/spark-dgraph-connector?spark=${{ matrix.params.spark-version }}&scala=${{ matrix.params.scala-version }}&snapshot
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - params: {"spark-version": "3.0.3", "scala-version": "2.12.10", "java-version": "11"}
          - params: {"spark-version": "3.1.3", "scala-version": "2.12.10", "java-version": "11"}
          - params: {"spark-version": "3.2.4", "scala-version": "2.12.15", "java-version": "11"}
          - params: {"spark-version": "3.3.4", "scala-version": "2.12.15", "java-version": "11"}
          - params: {"spark-version": "3.4.4", "scala-version": "2.12.17", "java-version": "11"}
          - params: {"spark-version": "3.5.3", "scala-version": "2.12.18", "java-version": "11"}
          - params: {"spark-version": "3.2.4", "scala-version": "2.13.5", "java-version": "11"}
          - params: {"spark-version": "3.3.4", "scala-version": "2.13.8", "java-version": "11"}
          - params: {"spark-version": "3.4.4", "scala-version": "2.13.8", "java-version": "11"}
          - params: {"spark-version": "3.5.3", "scala-version": "2.13.8", "java-version": "11"}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK and publish to Sonatype
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.params.java-version }}
          distribution: zulu
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Inspect GPG
        run: gpg -k

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-mvn-snapshot-${{ matrix.params.spark-version }}-${{ matrix.params.scala-version }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-mvn-snapshot-${{ matrix.params.spark-version }}-${{ matrix.params.scala-version }}-

      - name: Remove cached connector snapshots
        run: |
          version=$(grep --max-count=1 "<version>.*</version>" pom.xml | sed -E -e "s/\s*<[^>]+>//g" -e "s/-SNAPSHOT//" -e "s/-[0-9.]+//g")
          find ~/.m2 ~/.ivy2 -type f -name "*spark-dgraph-connector_*-$version-*-SNAPSHOT.jar" -delete 2>/dev/null || true

      - name: Publish snapshot
        run: |
          ./set-version.sh ${{ matrix.params.spark-version }} ${{ matrix.params.scala-version }}
          mvn clean deploy -Dsign -Dspotless.check.skip -DskipTests -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE}}

      - name: Test snapshot
        id: test-package
        run: |
          ./test-release.sh
