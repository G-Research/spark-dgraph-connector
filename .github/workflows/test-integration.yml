name: Test Integration

on:
  workflow_call:

jobs:
  test-integration:
    name: Integration Tests (Dgraph ${{ matrix.dgraph-version }} Spark ${{ matrix.spark-version }} Scala ${{ matrix.scala-compat-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        spark-compat-version: ["3.4", "3.5", "4.0", "4.1", "4.2"]
        dgraph-minor-version: ["20.11", "21.12", "22.0", "23.1", "24.1", "25.3"]
        include:
          - spark-compat-version: '3.2'
            spark-version: '3.2.4'
            scala-compat-version: '2.13'
            scala-version: '2.13.5'
            java-version: 11
            dgraph-minor-version: "25.3"
            dgraph-version: "25.3.8"
            hadoop-version: '3.2'

          - spark-compat-version: '3.3'
            spark-version: '3.3.4'
            scala-compat-version: '2.13'
            scala-version: '2.13.8'
            java-version: 11
            dgraph-minor-version: "25.3"
            dgraph-version: "25.3.8"
            hadoop-version: '3'

          - spark-compat-version: '3.4'
            spark-version: '3.4.4'
            scala-compat-version: '2.13'
            scala-version: '2.13.8'
            java-version: 11
            hadoop-version: '3'
          - spark-compat-version: '3.5'
            spark-version: '3.5.9'
            scala-compat-version: '2.13'
            scala-version: '2.13.8'
            java-version: 11
            hadoop-version: '3'
          - spark-compat-version: '4.0'
            spark-version: '4.0.4'
            scala-compat-version: '2.13'
            scala-version: '2.13.16'
            java-version: 17
            hadoop-version: '3'
          - spark-compat-version: '4.1'
            spark-version: '4.1.3'
            scala-compat-version: '2.13'
            scala-version: '2.13.17'
            java-version: 17
            hadoop-version: '3'
          - spark-compat-version: '4.2'
            spark-version: '4.2.0'
            scala-compat-version: '2.13'
            scala-version: '2.13.18'
            java-version: 17
            hadoop-version: '3'

          - dgraph-minor-version: "20.11"
            dgraph-version: "20.11.3"
          - dgraph-minor-version: "21.12"
            dgraph-version: "21.12.0"
          - dgraph-minor-version: "22.0"
            dgraph-version: "22.0.2"
          - dgraph-minor-version: "23.1"
            dgraph-version: "23.1.1"
          - dgraph-minor-version: "24.1"
            dgraph-version: "24.1.9"
          - dgraph-minor-version: "25.3"
            dgraph-version: "25.3.8"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        uses: ./.github/actions/test-integrate
        with:
          spark-version: ${{ matrix.spark-version }}
          scala-version: ${{ matrix.scala-version }}
          spark-compat-version: ${{ matrix.spark-compat-version }}
          scala-compat-version: ${{ matrix.scala-compat-version }}
          java-version: ${{ matrix.java-version }}
          dgraph-version: ${{ matrix.dgraph-version }}
          hadoop-version: ${{ matrix.hadoop-version }}

